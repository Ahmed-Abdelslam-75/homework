<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجربة تصميم: تيرمنال</title>
<meta name="theme-color" content="#0A0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#0A0E14;--chrome:#141A23;--line:#1F2733;--txt:#C9D4E3;--dim:#5C6B7F;
      --go:#27E07F;--no:#FF5C5C;--cy:#49C7FF;--am:#FFB454;--pur:#C89BFF}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:14.5px;line-height:1.75;
  display:flex;flex-direction:column;overflow:hidden}
.ar{font-family:Cairo,sans-serif;direction:rtl;text-align:right}

.chrome{flex:none;background:var(--chrome);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:9px 13px}
.dots{display:flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.ttl{flex:1;text-align:center;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{font-size:12.5px;color:var(--go);white-space:nowrap}

.term{flex:1;overflow-y:auto;padding:14px 14px 6px}
.ln{white-space:pre-wrap;word-break:break-word;animation:fade .18s both}
@keyframes fade{from{opacity:0}}
.pr{color:var(--go)}
.pr b{color:var(--cy);font-weight:500}
.pr i{color:var(--pur);font-style:normal}
.cm{color:var(--dim)}
.cm.ar{font-size:13.5px}
.out{color:var(--txt)}
.q{color:#fff;font-weight:500}
.ok{color:var(--go)}
.bad{color:var(--no)}
.key{color:var(--am)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--go);vertical-align:-3px;
  animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.dock{flex:none;border-top:1px solid var(--line);background:var(--chrome);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.hint{color:var(--dim);font-size:12px;margin:0 0 8px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.keys.two{grid-template-columns:repeat(2,1fr)}
.k{border:1px solid var(--line);background:#0E141C;color:var(--txt);border-radius:7px;padding:11px 6px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.12s;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k:hover{border-color:var(--go);color:var(--go)}
.k:active{transform:translateY(1px)}
.k b{color:var(--am);font-weight:700}
.inrow{display:flex;gap:8px;align-items:center;background:#0E141C;border:1px solid var(--line);
  border-radius:7px;padding:9px 11px}
.inrow span{color:var(--go)}
.inrow input{flex:1;border:0;background:transparent;color:var(--txt);font:inherit;font-size:14.5px;min-width:0}
.inrow input:focus{outline:none}
.inrow button{border:0;background:var(--go);color:#04210F;border-radius:5px;font:inherit;font-weight:700;
  padding:6px 13px;cursor:pointer}

.switch{flex:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#070A0F;
  font-family:Cairo,sans-serif;font-size:12.5px}
.switch a{color:var(--txt);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.switch a.on{background:var(--go);color:#04210F;border-color:var(--go)}
</style>
</head>
<body>

<div class="chrome">
  <span class="dots"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span>
  <span class="ttl">unit3 &mdash; homework &mdash; bash</span>
  <span class="bars" id="bars"></span>
</div>

<div class="term" id="term"></div>
<div class="dock" id="dock"></div>
<nav class="switch" id="nav"></nav>

<script>
const Q = [
  {q:"Which status code means the server itself failed?", o:["200","404","500","302"], a:2,
   why:"500 is the server's own failure: the address existed, but the server broke while handling it.",
   ar:"500 عطل في السيرفر نفسه، و404 معناها العنوان مش موجود."},
  {q:"Semantic HTML changes the way the page looks on the screen.", o:["true","false"], a:1, two:true,
   why:"It changes the meaning of the elements, not the appearance. Appearance is CSS.",
   ar:"بيغير المعنى مش الشكل. الصفحة شكلها زي ما هو بالظبط."},
  {q:"Which of these is NOT a benefit of semantic HTML?",
   o:["screen readers understand the structure","search engines understand the content",
      "the display speed necessarily becomes faster","it reaches users with visual impairments"], a:2, two:true,
   why:"Semantic HTML is about meaning, not speed. Watch the word necessarily.",
   ar:"الوسوم بتدي معنى، مش سرعة."},
  {q:"HTTP and HTTPS are two examples of a ______ .", type:true,
   accept:["protocol","communication protocol"], show:"protocol",
   why:"A protocol is the agreed set of rules for the exchange.",
   ar:"البروتوكول هو القواعد المتفق عليها بين الطرفين."}
];

const term = document.getElementById("term"), dock = document.getElementById("dock"),
      bars = document.getElementById("bars");
let at = 0, score = 0, busy = false;

function line(html, cls){
  const d = document.createElement("div");
  d.className = "ln" + (cls ? " " + cls : "");
  d.innerHTML = html;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
  return d;
}

function type(text, cls, done){
  const d = line("", cls);
  const cur = document.createElement("span");
  cur.className = "cursor";
  d.appendChild(cur);
  let i = 0;
  const t = setInterval(() => {
    i += 2;
    d.textContent = text.slice(0, i);
    d.appendChild(cur);
    term.scrollTop = term.scrollHeight;
    if (i >= text.length){
      clearInterval(t);
      d.textContent = text;
      done && done();
    }
  }, 14);
}

function paintBars(){
  let s = "[";
  for (let i = 0; i < Q.length; i++) s += i < at ? "■" : "□";
  bars.textContent = s + "] " + score + "/" + Q.length;
}

function prompt(){
  return '<span class="pr">bashmohandes<b>@</b>unit3<b>:</b><i>~</i><b>$</b> </span>';
}

function ask(){
  if (at >= Q.length) return finish();
  const q = Q[at];
  paintBars();
  busy = true;
  line(prompt() + '<span class="out">ask --question ' + (at + 1) + "</span>");
  setTimeout(() => {
    type(q.q, "q", () => {
      if (!q.type) q.o.forEach((o, k) => line('  <span class="key">[' + (k + 1) + "]</span> " + o, "out"));
      line("");
      dockFor(q);
      busy = false;
    });
  }, 260);
}

function dockFor(q){
  dock.innerHTML = "";
  const h = document.createElement("p");
  h.className = "hint";
  h.textContent = q.type ? "type your answer, then Enter" : "pick a number";
  dock.appendChild(h);
  if (q.type){
    const row = document.createElement("div");
    row.className = "inrow";
    row.innerHTML = '<span>&gt;</span><input id="tin" autocomplete="off" spellcheck="false"><button id="tgo">run</button>';
    dock.appendChild(row);
    const go = () => { const v = row.querySelector("#tin").value.trim(); if (v) answer(v); };
    row.querySelector("#tgo").onclick = go;
    row.querySelector("#tin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    row.querySelector("#tin").focus();
  } else {
    const g = document.createElement("div");
    g.className = "keys" + (q.two ? " two" : "");
    q.o.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "k";
      b.innerHTML = "<b>" + (k + 1) + "</b>" + (q.two ? "  " + (o.length > 18 ? o.slice(0, 17) + "…" : o) : "");
      b.title = o;
      b.onclick = () => answer(k);
      g.appendChild(b);
    });
    dock.appendChild(g);
  }
}

function answer(v){
  if (busy) return;
  const q = Q[at];
  const right = q.type ? q.accept.some(a => a === String(v).toLowerCase()) : v === q.a;
  const said = q.type ? v : (v + 1) + "   // " + q.o[v];
  dock.innerHTML = '<p class="hint">&nbsp;</p>';
  line(prompt() + '<span class="out">' + said + "</span>");
  if (right) score++;
  at++;
  paintBars();
  setTimeout(() => {
    line(right ? "✔ correct" : "✘ wrong", right ? "ok" : "bad");
    if (!right) line("  expected: " + (q.type ? q.show : (q.a + 1) + "   // " + q.o[q.a]), "key");
    line("# " + q.why, "cm");
    line("# " + q.ar, "cm ar");
    line("");
    setTimeout(ask, 320);
  }, 300);
}

function finish(){
  const failed = Q.length - score;
  line(prompt() + '<span class="out">summary</span>');
  setTimeout(() => {
    line("─".repeat(26), "cm");
    line(Q.length + " questions, " + score + " passed, " + failed + " failed", failed ? "bad" : "ok");
    line("# ده شكل التصميم ده: جلسة تيرمنال، كل سؤال أمر وكل إجابة سطر، والشرح تعليق تحته.", "cm ar");
    dock.innerHTML = '<p class="hint">done &middot; refresh to run again</p>';
  }, 300);
}

const NAV = [["chat.html","تيرمنال"],["talk.html","حوار"],["paper.html","ورقة"],["cards.html","كروت"],
             ["map.html","خريطة"],["story.html","ستوري"],["show.html","مسابقة"],["notebook.html","كشكول"],
             ["rings.html","دوائر"],["index.html","الكل"]];
document.getElementById("nav").innerHTML = NAV.map(([h, t]) =>
  '<a href="' + h + '"' + (h === "chat.html" ? ' class="on"' : "") + ">" + t + "</a>").join("");

line('<span class="cm"># Programming and AI &middot; Unit 3 &middot; 4 questions</span>');
line('<span class="cm"># your answers go to El Bashmohandes when you finish</span>');
line("");
ask();
</script>
</body>
</html>
