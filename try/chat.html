<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجربة تصميم: محادثة</title>
<meta name="theme-color" content="#0B0A1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B0A1F; --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.16);
  --txt:#F2F1FF; --dim:#A8A4CF; --cy:#45E0FF; --vi:#8B5CFF; --pk:#FF5FA2;
  --go:#2EE6A8; --no:#FF5C7A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--txt);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;
  line-height:1.55;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(620px 420px at 12% -6%,rgba(139,92,255,.42),transparent 62%),
    radial-gradient(560px 420px at 92% 8%,rgba(69,224,255,.26),transparent 60%),
    radial-gradient(520px 420px at 70% 104%,rgba(255,95,162,.26),transparent 62%),
    var(--bg)}
.ar{font-family:Cairo,sans-serif}
.en{direction:ltr;text-align:left;unicode-bidi:isolate;display:block}

/* floating header card */
.bar{flex:none;margin:12px 12px 4px;padding:11px 14px;border-radius:22px;
  background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  display:flex;align-items:center;gap:12px}
.ring{width:46px;height:46px;flex:none;border-radius:50%;padding:2.5px;
  background:conic-gradient(var(--cy),var(--vi),var(--pk),var(--cy))}
.ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#15123A;
  font-weight:700;font-size:15px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.nm i{font-family:Cairo,sans-serif;font-style:normal;font-size:12px;color:var(--dim)}
.prog{position:relative;width:44px;height:44px;flex:none}
.prog svg{transform:rotate(-90deg)}
.prog .n{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums}

/* thread */
.thread{flex:1;overflow-y:auto;padding:10px 14px 6px;display:flex;flex-direction:column;
  justify-content:flex-end;gap:12px}
.thread>.row{flex:none}
.row{display:flex}
.row.them{justify-content:flex-end}
.row.me{justify-content:flex-start}
.b{max-width:84%;padding:13px 16px;border-radius:22px;position:relative;animation:rise .26s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}
.them .b{background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-start-end-radius:8px}
.me .b{background:linear-gradient(135deg,var(--cy),var(--vi));color:#0A0620;font-weight:600;
  border-start-start-radius:8px;box-shadow:0 10px 26px rgba(139,92,255,.35)}
.b .q{font-size:17px;font-weight:600}
.b .tiny{font-family:Cairo,sans-serif;font-size:11.5px;color:var(--dim);margin-top:5px}
.me .b .tiny{color:rgba(10,6,32,.65)}
.b.good{box-shadow:0 0 0 1.5px var(--go),0 10px 30px rgba(46,230,168,.18)}
.b.bad{box-shadow:0 0 0 1.5px var(--no),0 10px 30px rgba(255,92,122,.16)}
.stamp{display:inline-flex;align-items:center;gap:7px;font-family:Cairo,sans-serif;font-size:13.5px;
  font-weight:700;margin-bottom:5px}
.stamp .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#07131A}
.stamp.y{color:var(--go)} .stamp.y .d{background:var(--go)}
.stamp.n{color:var(--no)} .stamp.n .d{background:var(--no);color:#2A0611}
.b .why{font-size:15.5px;color:#E3E1FF}
.b .arx{font-family:Cairo,sans-serif;font-size:14.5px;color:var(--dim);line-height:1.95;margin-top:5px}
.dots{display:flex;gap:5px;padding:15px 18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:bob 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s} .dots i:nth-child(3){animation-delay:.32s}
@keyframes bob{50%{opacity:.3;transform:translateY(-4px)}}

/* reply dock */
.dock{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;max-width:78vw;border:1px solid var(--edge);background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--txt);
  border-radius:999px;padding:12px 18px;font:inherit;font-size:15.5px;cursor:pointer;transition:.15s;
  white-space:nowrap;direction:ltr}
.chip:hover{border-color:var(--cy);color:#fff}
.chip:active{transform:scale(.97)}
.chip.wrap{white-space:normal;max-width:100%;border-radius:18px;text-align:start;line-height:1.35}
.typebox{display:flex;gap:9px;align-items:center;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:7px 7px 7px 18px}
.typebox input{flex:1;min-width:0;border:0;background:transparent;color:var(--txt);font:inherit;
  font-size:16px;direction:ltr}
.typebox input:focus{outline:none}
.typebox input::placeholder{color:var(--dim)}
.send{width:44px;height:44px;flex:none;border:0;border-radius:50%;cursor:pointer;color:#0A0620;font-size:17px;
  background:linear-gradient(135deg,var(--cy),var(--vi));box-shadow:0 8px 22px rgba(69,224,255,.3)}
.hint{font-family:Cairo,sans-serif;font-size:12px;color:var(--dim);margin:0 6px 6px}

.switch{flex:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,7,22,.8);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-family:Cairo,sans-serif;font-size:12.5px}
.switch a{color:var(--txt);text-decoration:none;border:1px solid var(--edge);border-radius:999px;padding:4px 10px}
.switch a.on{background:linear-gradient(135deg,var(--cy),var(--vi));color:#0A0620;border-color:transparent;font-weight:700}
</style>
</head>
<body>

<header class="bar">
  <div class="ring"><span>ب</span></div>
  <div class="nm"><b>El Bashmohandes</b><i>الوحدة التالتة &middot; أربع أسئلة</i></div>
  <div class="prog">
    <svg width="44" height="44">
      <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="4"/>
      <circle id="pr" cx="22" cy="22" r="18" fill="none" stroke="#2EE6A8" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="113"
              style="transition:stroke-dashoffset .6s cubic-bezier(.2,.9,.3,1)"/>
    </svg>
    <div class="n" id="sc">0</div>
  </div>
</header>

<div class="thread" id="thread"></div>
<div class="dock" id="dock"></div>
<nav class="switch" id="nav"></nav>

<script>
const Q = [
  {q:"Which status code means the server itself failed?", o:["200","404","500","302"], a:2,
   why:"500 is the server's own failure: the address existed, but the server broke while handling it.",
   ar:"500 عطل في السيرفر نفسه، و404 معناها العنوان مش موجود."},
  {q:"Semantic HTML changes the way the page looks on the screen.", o:["True","False"], a:1,
   why:"It changes the meaning of the elements, not the appearance. Appearance is CSS.",
   ar:"بيغير المعنى مش الشكل. الصفحة شكلها زي ما هو بالظبط."},
  {q:"Which of these is NOT a benefit of semantic HTML?",
   o:["Screen readers understand the structure","Search engines understand the content",
      "The display speed necessarily becomes faster","It reaches users with visual impairments"], a:2, wrap:true,
   why:"Semantic HTML is about meaning, not speed. Watch the word necessarily.",
   ar:"الوسوم بتدي معنى، مش سرعة."},
  {q:"HTTP and HTTPS are two examples of a ______ .", type:true,
   accept:["protocol","communication protocol"], show:"protocol",
   why:"A protocol is the agreed set of rules for the exchange.",
   ar:"البروتوكول هو القواعد المتفق عليها بين الطرفين."}
];

const thread = document.getElementById("thread"), dock = document.getElementById("dock");
let at = 0, score = 0;

function bubble(side, html, cls){
  const row = document.createElement("div");
  row.className = "row " + side;
  const b = document.createElement("div");
  b.className = "b" + (cls ? " " + cls : "");
  b.innerHTML = html;
  row.appendChild(b);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  return b;
}

function dots(then){
  const row = document.createElement("div");
  row.className = "row them";
  row.innerHTML = '<div class="b dots"><i></i><i></i><i></i></div>';
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  setTimeout(() => { row.remove(); then(); }, 600);
}

function progress(){
  document.getElementById("sc").textContent = score;
  document.getElementById("pr").style.strokeDashoffset = 113 * (1 - score / Q.length);
}

function ask(){
  if (at >= Q.length) return finish();
  const q = Q[at];
  dots(() => {
    bubble("them", '<span class="q en">' + q.q + '</span><div class="tiny">سؤال ' + (at + 1) +
      " من " + Q.length + "</div>");
    dock.innerHTML = "";
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = q.type ? "اكتب الكلمة الناقصة" : "اختار إجابة";
    dock.appendChild(hint);
    if (q.type){
      const box = document.createElement("div");
      box.className = "typebox";
      box.innerHTML = '<input id="tin" placeholder="type here" autocomplete="off"><button class="send" id="sb">&#10148;</button>';
      dock.appendChild(box);
      const go = () => { const v = box.querySelector("#tin").value.trim(); if (v) answer(v); };
      box.querySelector("#sb").onclick = go;
      box.querySelector("#tin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      box.querySelector("#tin").focus();
    } else {
      const strip = document.createElement("div");
      strip.className = "strip" + (q.wrap ? " col" : "");
      if (q.wrap) strip.style.cssText = "flex-direction:column;overflow:visible";
      q.o.forEach((o, k) => {
        const b = document.createElement("button");
        b.className = "chip" + (q.wrap ? " wrap" : "");
        b.textContent = o;
        b.onclick = () => answer(k);
        strip.appendChild(b);
      });
      dock.appendChild(strip);
    }
  });
}

function answer(v){
  const q = Q[at];
  const right = q.type
    ? q.accept.some(a => a === String(v).toLowerCase())
    : v === q.a;
  const said = q.type ? v : q.o[v];
  bubble("me", '<span class="en">' + said + "</span>", right ? "good" : "bad");
  dock.innerHTML = '<p class="hint">&nbsp;</p>';
  if (right) score++;
  progress();
  dots(() => {
    const stamp = '<span class="stamp ' + (right ? "y" : "n") + '"><span class="d">' +
      (right ? "&#10003;" : "&#10007;") + "</span>" + (right ? "صح" : "غلط") + "</span>";
    const corr = right ? "" : '<span class="en" style="font-weight:600;margin-bottom:4px">' +
      (q.type ? q.show : q.o[q.a]) + "</span>";
    bubble("them", stamp + corr + '<span class="why en">' + q.why + '</span><div class="arx">' + q.ar + "</div>");
    at++;
    setTimeout(ask, 380);
  });
}

function finish(){
  dock.innerHTML = '<p class="hint">خلصت الأربعة &middot; درجتك ' + score + " من " + Q.length + "</p>";
  dots(() => bubble("them", '<span class="stamp y"><span class="d">&#10003;</span>تمام</span>' +
    '<div class="arx">ده شكل التصميم ده: نفس المحادثة، بس بزجاج ونيون بدل شكل الواتساب. ' +
    "الإجابات فقاعات، والتقدم دايرة فوق.</div>"));
}

const NAV = [["chat.html","محادثة"],["term.html","تيرمنال"],["talk.html","حوار"],["paper.html","ورقة"],
             ["cards.html","كروت"],["map.html","خريطة"],["story.html","ستوري"],["show.html","مسابقة"],
             ["notebook.html","كشكول"],["rings.html","دوائر"],["index.html","الكل"]];
document.getElementById("nav").innerHTML = NAV.map(([h, t]) =>
  '<a href="' + h + '"' + (h === "chat.html" ? ' class="on"' : "") + ">" + t + "</a>").join("");

progress();
bubble("them", '<span class="arx" style="color:#E3E1FF;font-size:15.5px">يلا نبدأ. أربع أسئلة بس، وبعد كل إجابة هقولك ليه.</span>');
setTimeout(ask, 500);
</script>
</body>
</html>
