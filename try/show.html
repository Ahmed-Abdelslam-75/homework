<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجربة تصميم: مسابقة</title>
<meta name="theme-color" content="#06070F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Anton&family=Inter:wght@500;600;700&display=swap">
<style>
:root{--stage:#06070F;--board:#101433;--edge:#2B3570;--gold:#FFD23F;--go:#2ED47A;--no:#FF4757}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
   radial-gradient(760px 420px at 50% -6%,rgba(255,210,63,.16),transparent 60%),
   radial-gradient(600px 400px at 50% 110%,rgba(43,53,112,.5),transparent 60%),var(--stage);
  color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.ar{font-family:Cairo,sans-serif}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}

.hud{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:560px;width:100%;margin:0 auto}
.pts{font-family:Anton,sans-serif;font-size:30px;letter-spacing:.02em;color:var(--gold);line-height:1;
  font-variant-numeric:tabular-nums}
.pts small{display:block;font-family:Cairo,sans-serif;font-size:11px;letter-spacing:0;color:#8C93C4}
.mult{margin-inline-start:auto;background:rgba(255,210,63,.14);border:1px solid rgba(255,210,63,.45);
  color:var(--gold);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .n{position:absolute;inset:0;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:20px}

.wrap{flex:1;min-height:0;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:14px 16px 10px;
  display:flex;flex-direction:column;gap:16px}
.board{background:linear-gradient(180deg,#19204B,var(--board));border:2px solid var(--edge);
  border-radius:20px;padding:22px 20px;box-shadow:0 0 0 6px rgba(43,53,112,.25),0 22px 50px rgba(0,0,0,.5);
  position:relative}
.board .no{position:absolute;top:-13px;inset-inline-start:20px;background:var(--gold);color:#1A1200;
  font-family:Anton,sans-serif;font-size:14px;letter-spacing:.06em;padding:4px 12px;border-radius:6px}
.board .q{font-size:clamp(20px,5.4vw,25px);font-weight:600;line-height:1.35;margin-top:6px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.a{position:relative;display:flex;align-items:center;gap:11px;border:2px solid var(--edge);
  border-radius:14px;background:linear-gradient(180deg,#161D47,#0E1333);color:#fff;font:inherit;
  font-size:16.5px;font-weight:600;padding:15px 14px;cursor:pointer;transition:.14s;text-align:start;direction:ltr}
.a.long{grid-column:span 2;font-size:15.5px;font-weight:500}
.a .k{width:30px;height:30px;flex:none;border-radius:8px;background:var(--edge);display:grid;place-items:center;
  font-family:Anton,sans-serif;font-size:15px;color:var(--gold)}
.a:hover{border-color:var(--gold)}
.a:active{transform:translateY(1px)}
.a.right{border-color:var(--go);background:linear-gradient(180deg,rgba(46,212,122,.28),rgba(46,212,122,.12));
  animation:flash .6s 2}
.a.right .k{background:var(--go);color:#04240F}
.a.wrong{border-color:var(--no);background:rgba(255,71,87,.16)}
.a.wrong .k{background:var(--no);color:#2B0509}
@keyframes flash{50%{box-shadow:0 0 0 4px rgba(46,212,122,.35)}}

.typerow{display:flex;gap:10px}
.typerow input{flex:1;border:2px solid var(--edge);border-radius:14px;background:#0E1333;color:#fff;
  padding:15px;font:inherit;font-size:17px;font-weight:600;direction:ltr}
.typerow input:focus{outline:none;border-color:var(--gold)}
.typerow button{border:0;border-radius:14px;background:var(--gold);color:#1A1200;font:inherit;font-weight:700;
  padding:0 22px;cursor:pointer}

.verdict{display:none;border-radius:16px;padding:15px 17px;border:2px solid}
.verdict.on{display:block;animation:up .3s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.verdict.good{border-color:var(--go);background:rgba(46,212,122,.12)}
.verdict.bad{border-color:var(--no);background:rgba(255,71,87,.1)}
.verdict .h{font-family:Anton,sans-serif;font-size:21px;display:flex;align-items:center;gap:10px}
.verdict.good .h{color:var(--go)} .verdict.bad .h{color:var(--no)}
.verdict .plus{margin-inline-start:auto;color:var(--gold);font-family:Anton,sans-serif}
.verdict .w{margin-top:6px;font-size:16px;line-height:1.5;direction:ltr;text-align:left}
.verdict .x{font-family:Cairo,sans-serif;font-size:14.5px;color:#9AA2D0;line-height:1.9;margin-top:3px}
.next{width:100%;border:0;border-radius:14px;background:var(--gold);color:#1A1200;font:inherit;
  font-size:17px;font-weight:700;padding:16px;cursor:pointer;display:none}
.next.on{display:block}

.switch{flex:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#04050B;
  font-family:Cairo,sans-serif;font-size:12.5px}
.switch a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:4px 10px}
.switch a.on{background:var(--gold);color:#1A1200;border-color:var(--gold)}
</style>
</head>
<body>

<div class="hud">
  <div class="pts"><span id="pts">0</span><small>نقطة</small></div>
  <div class="timer">
    <svg width="54" height="54"><circle cx="27" cy="27" r="23" fill="none" stroke="#2B3570" stroke-width="5"/>
      <circle id="ring" cx="27" cy="27" r="23" fill="none" stroke="#FFD23F" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg>
    <div class="n" id="tnum">20</div>
  </div>
  <div class="mult" id="mult">x1</div>
</div>

<div class="wrap">
  <div class="board"><span class="no" id="qno"></span><div class="q en" id="q"></div></div>
  <div id="body"></div>
  <div class="verdict" id="vd"><div class="h"><span id="vh"></span><span class="plus" id="plus"></span></div>
    <div class="w" id="vw"></div><div class="x" id="vx"></div></div>
  <button class="next" id="next"></button>
</div>

<nav class="switch" id="nav"></nav>

<script>
const Q = [
  {q:"Which status code means the server itself failed?", o:["200","404","500","302"], a:2,
   why:"500 is the server's own failure: the address existed, but the server broke while handling it.",
   ar:"500 عطل في السيرفر نفسه، و404 معناها العنوان مش موجود."},
  {q:"Semantic HTML changes the way the page looks on the screen.", o:["True","False"], a:1,
   why:"It changes the meaning of the elements, not the appearance. Appearance is CSS.",
   ar:"بيغير المعنى مش الشكل. الصفحة شكلها زي ما هو بالظبط."},
  {q:"Which of these is NOT a benefit of semantic HTML?",
   o:["Screen readers understand the structure","Search engines understand the content",
      "The display speed necessarily becomes faster","It reaches users with visual impairments"], a:2, long:true,
   why:"Semantic HTML is about meaning, not speed. Watch the word necessarily.",
   ar:"الوسوم بتدي معنى، مش سرعة."},
  {q:"HTTP and HTTPS are two examples of a ______ .", type:true,
   accept:["protocol","communication protocol"], show:"protocol",
   why:"A protocol is the agreed set of rules for the exchange.",
   ar:"البروتوكول هو القواعد المتفق عليها بين الطرفين."}
];
const SEC = 20, CIRC = 144.5;
const el = id => document.getElementById(id);
let at = 0, pts = 0, streak = 0, left = SEC, tick = null;

function render(){
  const q = Q[at];
  el("qno").textContent = "Q" + (at + 1);
  el("q").textContent = q.q;
  el("vd").className = "verdict";
  el("next").className = "next";
  const body = el("body");
  body.innerHTML = "";
  if (q.type){
    const row = document.createElement("div");
    row.className = "typerow";
    row.innerHTML = '<input id="tin" placeholder="type the word" autocomplete="off"><button id="tgo">OK</button>';
    body.appendChild(row);
    row.querySelector("#tgo").onclick = () => { const v = row.querySelector("#tin").value.trim(); if (v) answer(v, null); };
  } else {
    const g = document.createElement("div");
    g.className = "grid";
    q.o.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "a" + (q.long ? " long" : "");
      b.innerHTML = '<span class="k">' + "ABCD"[k] + "</span><span>" + o + "</span>";
      b.onclick = () => answer(k, b);
      g.appendChild(b);
    });
    body.appendChild(g);
  }
  left = SEC;
  paintTimer();
  clearInterval(tick);
  tick = setInterval(() => {
    left--;
    paintTimer();
    if (left <= 0) answer(-1, null);
  }, 1000);
}

function paintTimer(){
  el("tnum").textContent = Math.max(left, 0);
  el("ring").setAttribute("stroke-dashoffset", String(CIRC * (1 - left / SEC)));
  el("ring").setAttribute("stroke", left <= 5 ? "#FF4757" : "#FFD23F");
}

function answer(v, node){
  clearInterval(tick);
  const q = Q[at];
  const right = v === -1 ? false
    : (q.type ? q.accept.some(a => a === String(v).toLowerCase()) : v === q.a);
  if (node) node.classList.add(right ? "right" : "wrong");
  if (!right && !q.type) el("body").querySelectorAll(".a")[q.a].classList.add("right");
  el("body").querySelectorAll("button,input").forEach(b => b.disabled = true);

  let gained = 0;
  if (right){
    streak++;
    const mult = Math.min(streak, 3);
    gained = (100 + left * 10) * mult;
    pts += gained;
  } else streak = 0;
  el("pts").textContent = pts;
  el("mult").textContent = "x" + Math.min(Math.max(streak, 1), 3);

  const vd = el("vd");
  vd.className = "verdict on " + (right ? "good" : "bad");
  el("vh").textContent = v === -1 ? "الوقت خلص" : (right ? "صح" : "غلط" + (q.type ? "، الإجابة: " + q.show : ""));
  el("plus").textContent = right ? "+" + gained : "";
  el("vw").textContent = q.why;
  el("vx").textContent = q.ar;
  el("next").className = "next on";
  el("next").textContent = at === Q.length - 1 ? "النتيجة النهائية" : "السؤال اللي بعده";
  el("next").onclick = () => { if (at === Q.length - 1) return finish(); at++; render(); };
}

function finish(){
  el("qno").textContent = "END";
  el("q").textContent = "Final score: " + pts;
  el("body").innerHTML = '<div style="font-family:Cairo,sans-serif;direction:rtl;color:#9AA2D0;line-height:1.9">' +
    "ده شكل التصميم ده: وقت بينزل، ونقط بتزيد كل ما تجاوب أسرع، وسلسلة بتضاعف النقط.</div>";
  el("vd").className = "verdict";
  el("next").className = "next on";
  el("next").textContent = "من الأول";
  el("next").onclick = () => location.reload();
  el("tnum").textContent = "0";
}

const NAV = [["chat.html","تيرمنال"],["talk.html","حوار"],["paper.html","ورقة"],["cards.html","كروت"],
             ["map.html","خريطة"],["story.html","ستوري"],["show.html","مسابقة"],["notebook.html","كشكول"],
             ["rings.html","دوائر"],["index.html","الكل"]];
el("nav").innerHTML = NAV.map(([h, t]) =>
  '<a href="' + h + '"' + (h === "show.html" ? ' class="on"' : "") + ">" + t + "</a>").join("");

render();
</script>
</body>
</html>
