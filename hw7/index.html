/* =====================================================================
   The notebook skin for Homework 7.

   One squared page you scroll down, a red margin the teacher marks in,
   and handwriting for anything written by hand. Nothing here is shared
   with the other six homeworks.
   ===================================================================== */
:root{
  --paper:#FDFBF2; --grid:#CFE0EE; --marg:#E9A0A0; --ink:#1B2A4A; --soft:#6E7B96;
  --pen:#D1372F; --ok:#1E8A5B; --amber:#B07A17; --hand:Kalam,"Comic Sans MS",cursive;
  --title:Caveat,cursive; --body:Kalam,"Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:#BDB5A4;color:var(--ink);font-family:var(--body);font-size:18.5px;line-height:1.95;
  padding:14px 8px 40px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}


/* ---------- the page ---------- */
.book{max-width:720px;margin:0 auto;background:var(--paper);border-radius:4px;position:relative;
  box-shadow:0 16px 40px rgba(0,0,0,.3);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:27px 27px;padding-block:30px 46px;padding-inline:72px 24px}
.book::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:54px;width:2px;background:var(--marg)}
.spiral{position:absolute;top:0;bottom:0;inset-inline-start:14px;width:26px;display:flex;flex-direction:column;
  justify-content:space-around;align-items:center;padding:26px 0;pointer-events:none}
.spiral i{width:13px;height:13px;border-radius:50%;background:#C9BFAC;box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
@media (max-width:560px){ .book{padding-block:24px 40px;padding-inline:56px 16px;background-size:24px 24px}
  .book::before{inset-inline-start:42px} .spiral{inset-inline-start:10px;width:20px} .spiral i{width:10px;height:10px} }

/* ---------- cover ---------- */
.cover{border-bottom:2px dashed #C6CFDD;padding-bottom:16px;margin-bottom:10px}
.cover .k{font-family:var(--body);font-size:13.5px;color:var(--soft);letter-spacing:.02em}
.cover h1{font-family:var(--title);font-size:42px;line-height:1.05;margin:4px 0 2px;font-weight:700}
.cover .sub{font-family:var(--title);font-size:25px;color:var(--soft);margin:0 0 14px}
.nameline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nameline label{font-family:var(--title);font-size:26px;color:var(--pen)}
.nameline input{flex:1;min-width:190px;border:0;border-bottom:2px solid var(--ink);background:transparent;
  font-family:var(--title);font-size:27px;color:var(--ink);padding:0 6px 2px}
.nameline input:focus{outline:none;border-bottom-color:var(--pen)}
.meta{font-family:var(--title);font-size:21px;color:var(--soft);margin-top:8px}

.warn{border:2px solid var(--pen);border-radius:4px;background:#FDEEED;padding:12px 14px;margin:14px 0}
.warn b{color:var(--pen)}

/* ---------- section headings ---------- */
.sec{font-family:var(--title);font-size:30px;color:var(--ink);margin:34px 0 4px;position:relative}
.sec::after{content:"";display:block;width:120px;height:3px;background:var(--amber);border-radius:3px;margin-top:2px;
  opacity:.5}
.sec .cnt{font-family:var(--body);font-size:14px;color:var(--soft)}

/* ---------- a question ---------- */
.q{position:relative;margin:0 0 30px;padding-top:4px}
.q .n{font-family:var(--title);font-size:28px;color:var(--pen);margin-inline-end:9px;unicode-bidi:isolate;direction:ltr}
.q .st{font-size:18.5px}
.q .note-line{font-family:var(--body);font-size:15px;color:var(--soft)}
.opts{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.pick{background:none;border:0;font:inherit;font-size:18.5px;color:var(--ink);cursor:pointer;text-align:start;
  padding:5px 13px;border-radius:42% 58% 52% 48% / 58% 42% 58% 42%;direction:ltr;width:100%}
.pick:hover{background:rgba(27,42,74,.06)}
.pick .let{font-family:var(--title);font-size:24px;margin-inline-end:8px;color:var(--soft)}
.pick.chosen{box-shadow:inset 0 0 0 2.5px var(--ink)}
.pick.good{box-shadow:inset 0 0 0 2.5px var(--ok);color:var(--ok)}
.pick.bad{box-shadow:inset 0 0 0 2.5px var(--pen);color:var(--pen)}
.pick[disabled]{cursor:default}

/* match */
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 10px;padding:9px 11px;border:2px dashed #C6CFDD;border-radius:4px}
.bank .w{font:inherit;font-size:17px;border:0;background:#EFF4F9;border-radius:3px;padding:4px 11px;cursor:pointer;
  color:var(--ink);direction:ltr}
.bank .w:hover{background:#DDE8F2}
.bank .w.used{opacity:.4}
.mrow{display:flex;gap:10px;align-items:baseline;padding:5px 0;direction:ltr}
.mrow .t{flex:1;direction:ltr;text-align:left}
.blank{min-width:7.5em;border-bottom:2px dotted #8C9AB5;font-family:var(--title);font-size:24px;
  color:var(--ink);background:none;border-top:0;border-inline:0;text-align:center;padding:0 7px;cursor:pointer;
  direction:ltr}
.blank.live{border-bottom-color:var(--pen);background:#FBF3D9}
.blank.good{color:var(--ok);border-bottom-color:var(--ok)}
.blank.bad{color:var(--pen);border-bottom-color:var(--pen);text-decoration:line-through}

/* order */
.orow{display:flex;gap:11px;align-items:center;padding:5px 0}
.obox{width:40px;height:40px;flex:none;border:2px solid var(--ink);border-radius:3px;background:none;
  font-family:var(--title);font-size:25px;color:var(--ink);cursor:pointer;line-height:1}
.obox.good{border-color:var(--ok);color:var(--ok)}
.obox.bad{border-color:var(--pen);color:var(--pen)}
.orow .t{flex:1;direction:ltr;text-align:left;font-size:17.5px}
.okbtn{font-family:var(--title);font-size:22px;background:none;border:2px solid var(--ink);border-radius:3px;padding:3px 18px;cursor:pointer;color:var(--ink);margin-top:6px}
.okbtn[disabled]{opacity:.35;cursor:not-allowed}

/* fill */
.frow{padding:5px 0;direction:ltr;text-align:left}
.wr{min-width:7em;border:0;border-bottom:2px dotted #8C9AB5;background:transparent;font-family:var(--title);
  font-size:25px;color:var(--ink);text-align:center;padding:0 6px;direction:ltr}
.wr:focus{outline:none;border-bottom-color:var(--pen);background:#FBF3D9}
.wr.good{color:var(--ok);border-bottom-color:var(--ok)}
.wr.bad{color:var(--pen);border-bottom-color:var(--pen)}

/* essay */
.marks{font-family:var(--title);font-size:22px;color:var(--pen);margin-inline-start:6px}
.refer{margin:8px 0 6px;padding:8px 12px;border-inline-start:3px solid var(--amber);background:#FCF6E7}
.refer .t{font-family:var(--body);font-size:14px;color:var(--amber);letter-spacing:.04em;text-transform:uppercase}
.tick{display:flex;gap:9px;align-items:center;background:none;border:0;font:inherit;font-size:17px;
  color:var(--ink);cursor:pointer;padding:3px 0;text-align:start;width:100%}
.tick .box{width:21px;height:21px;flex:none;border:2px solid var(--amber);border-radius:3px;display:grid;
  place-items:center;font-size:14px;color:var(--pen);font-family:var(--title)}
.tick[aria-checked="true"] .lb{text-decoration:line-through;color:var(--soft)}
.essaybox{width:100%;min-height:13rem;border:0;background:
  repeating-linear-gradient(transparent,transparent 33px,#C6CFDD 33px,#C6CFDD 34px);
  font-family:var(--body);font-size:18px;line-height:34px;color:var(--ink);padding:0 4px;resize:vertical;
  direction:ltr;text-align:left}
.essaybox:focus{outline:none;background-color:#FBF8E8}
.wc{font-family:var(--body);font-size:14px;color:var(--soft);margin-top:4px}

/* the red pen */
.red{position:absolute;inset-inline-start:-58px;top:0;width:46px;text-align:center;font-family:var(--title);
  color:var(--pen);font-size:34px;line-height:1;opacity:0;transform:rotate(-12deg);transition:opacity .25s}
.red.on{opacity:1}
.red.part{font-size:24px;line-height:1.2}
@media (max-width:560px){ .red{inset-inline-start:-46px;width:38px;font-size:28px} }
.pennote{display:none;margin-top:7px;font-family:var(--title);font-size:22px;color:var(--pen);line-height:1.4}
.pennote.on{display:block}
.pennote .en{display:block;margin-bottom:2px}

.pennote .fix{color:var(--ok)}

/* ---------- hand in ---------- */
.handin{margin-top:36px;border-top:2px dashed #C6CFDD;padding-top:18px}
.handin h2{font-family:var(--title);font-size:32px;margin:0 0 6px}
.tally{display:grid;gap:4px;margin:10px 0 14px}
.tally div{display:flex;gap:10px;align-items:baseline;font-size:17px}
.tally .v{font-family:var(--title);font-size:22px;margin-inline-start:auto;unicode-bidi:isolate;direction:ltr}
.tally .v.done{color:var(--ok)} .tally .v.open{color:var(--pen)}
.send{font-family:var(--title);font-size:26px;background:var(--ink);color:var(--paper);border:0;border-radius:4px;
  padding:12px 30px;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.send.again{background:var(--pen)}
.status{font-size:16px;margin-top:10px;min-height:1.6em}
.status.bad{color:var(--pen)} .status.good{color:var(--ok)}
.ghost{font-family:var(--body);font-size:15px;background:none;border:1.5px solid #C6CFDD;border-radius:3px;
  padding:7px 14px;cursor:pointer;color:var(--soft);margin-inline-end:8px}
.ghost:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- the marked summary ---------- */
.result{margin-top:22px;border:2.5px solid var(--pen);border-radius:4px;padding:16px 18px;background:#FFF8F7}
.result .big{font-family:var(--title);font-size:46px;color:var(--pen);line-height:1}
.result .big span{font-size:24px;color:var(--soft)}
.result .line{font-size:17px;margin-top:6px}
.model{margin-top:12px;border-inline-start:3px solid var(--ok);padding:8px 12px;background:#F1F9F4}
.model .t{font-family:var(--body);font-size:13.5px;color:var(--ok);letter-spacing:.04em;text-transform:uppercase}
.model p{margin:4px 0 0;font-size:17px;direction:ltr;text-align:left}

/* ---------- the bookmark tab ---------- */
.tab bdi{unicode-bidi:isolate;direction:ltr}
.tab{position:fixed;inset-inline-end:0;top:40%;background:var(--ink);color:var(--paper);
  font-family:var(--title);font-size:21px;padding:10px 12px;border-radius:6px 0 0 6px;
  box-shadow:-3px 3px 10px rgba(0,0,0,.25);z-index:5;text-align:center;line-height:1.1}
.tab small{display:block;font-family:var(--body);font-size:11px;opacity:.75}

.foot{max-width:720px;margin:14px auto 0;text-align:center;color:#6B6558;font-size:13px;
  font-family:var(--body)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} html{scroll-behavior:auto} }

</style>

  return { name: "", view: "start", answers: {}, ticks: {}, checked: {}, visited: {}, streak: 0, best: 0,
           startedAt: null, sent: null, submissionId: null };
}
let S = fresh();
try { const raw = localStorage.getItem(STORE); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

/* ---------- is this browser actually keeping anything? ----------
   A private tab on an iPhone throws the answers away the moment the tab closes, and Safari clears a site it
   has not seen for a week. The page cannot stop either one, so it checks that writing works, asks to keep the
   storage, and lets the student carry a copy of their own. */
const STORE_OK = (function () {
  try {
    const probe = STORE + "-probe";
    localStorage.setItem(probe, "1");
    const ok = localStorage.getItem(probe) === "1";
    localStorage.removeItem(probe);
    return ok;
  } catch (e) { return false; }
})();
function answeredCount() { return SCREENS.reduce((a, s, i) => a + (hasAnswer(i) ? 1 : 0), 0); }

/* A copy the student keeps in their own Files, which nothing on the phone clears. */
function backupBlob() {
  return new Blob([JSON.stringify({ app: "homework", hw: HW.id, name: S.name, savedAt: new Date().toISOString(),
                                    answered: answeredCount(), state: S }, null, 1)], { type: "application/json" });
}
function saveBackup() {
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  const url = URL.createObjectURL(backupBlob());
  const a = document.createElement("a");
  a.href = url;
  a.download = (HW.id + "-" + (S.name || "answers") + "-" + stamp + ".json").replace(/\s+/g, "-");
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function readBackup(file) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onerror = () => resolve(null);
    r.onload = () => {
      try {
        const d = JSON.parse(String(r.result));
        resolve(d && d.state && d.hw === HW.id ? d : null);
      } catch (e) { resolve(null); }
    };
    r.readAsText(file);
  });
}

/* ---------- scoring ---------- */
function norm(s) {
  return String(s || "").toLowerCase().replace(/[‘’`´]/g, "'").replace(/[^a-z0-9.,'\/ ]/g, " ")
    .replace(/\s+/g, " ").trim().replace(/[.,]+$/, "").trim();
}
function orderOf(i) {
  const s = SCREENS[i];
  const cur = S.answers["order-" + i];
  return Array.isArray(cur) && cur.length === s.items.length ? cur : s.items.map((_, k) => k);
}
/* one entry per point: {id, ok, given, correct} */
function itemResults(i) {
  const s = SCREENS[i], k = KEY.screens[i], A = S.answers;
  if (s.type === "mcq") {
    const v = A[s.ids[0]];
    return [{ id: s.ids[0], ok: v === k.answer, given: typeof v === "number" ? "ABCD"[v] + ". " + s.options[v] : "no answer", correct: "ABCD"[k.answer] + ". " + s.options[k.answer] }];
  }
  if (s.type === "tf") {
    const v = A[s.ids[0]];
    const t = (b) => (b ? "True" : "False");
    return [{ id: s.ids[0], ok: v === k.answer, given: typeof v === "boolean" ? t(v) : "no answer", correct: t(k.answer) }];
  }
  if (s.type === "match") return s.ids.map((id, r) => {
    const v = A[id];
    return { id, ok: v === k.answers[r], given: typeof v === "number" ? s.choices[v] : "no answer", correct: s.choices[k.answers[r]] };
  });
  if (s.type === "order") {
    const cur = orderOf(i);
    return s.ids.map((id, p) => ({ id, ok: cur[p] === k.correct[p], given: s.items[cur[p]], correct: s.items[k.correct[p]] }));
  }
  if (s.type === "fill") return s.ids.map((id, r) => {
    const v = String(A[id] || "").trim();
    return { id, ok: k.accept[r].map(norm).includes(norm(v)), given: v || "no answer", correct: k.show[r] };
  });
  return [];
}
function screenScore(i) { const r = itemResults(i); return { got: r.filter((x) => x.ok).length, of: r.length }; }
function hasAnswer(i) {
  const s = SCREENS[i], A = S.answers;
  if (s.type === "mcq" || s.type === "tf") return A[s.ids[0]] !== undefined;
  if (s.type === "order") return !!S.visited[i];
  if (s.type === "essay") return String(A[s.ids[0]] || "").trim().length > 0;
  return s.ids.some((id) => A[id] !== undefined && String(A[id]).trim() !== "");
}
function screenState(i) {
  const s = SCREENS[i];
  if (s.type === "essay") return hasAnswer(i) ? "essay" : "";
  if (S.checked[i]) { const sc = screenScore(i); return sc.got === sc.of ? "good" : sc.got === 0 ? "bad" : "part"; }
  return hasAnswer(i) ? "seen" : "";
}
function totals() {
  let got = 0;
  const rounds = ROUNDS.map((r, ri) => ({ title: r.title, got: 0, of: 0 }));
  SCREENS.forEach((s, i) => {
    if (s.type === "essay") return;
    const sc = screenScore(i);
    rounds[s.round].of += sc.of;
    if (S.checked[i]) { rounds[s.round].got += sc.got; got += sc.got; }
  });
  return { got, of: AUTO_TOTAL, rounds: rounds.filter((r) => r.of > 0) };
}
function checkedCorrect() {
  let n = 0;
  SCREENS.forEach((s, i) => { if (S.checked[i] && s.type !== "essay") n += screenScore(i).got; });
  return n;
}

/* ---------- HUD ---------- */
function currentRound() {
  if (S.view.startsWith("round:")) return Number(S.view.slice(6));
  if (S.view.startsWith("q:")) return SCREENS[Number(S.view.slice(2))].round;
  if (S.view === "finish" || S.view === "result") return ROUNDS.length;
  return -1;
}
function renderHud() {
  const hud = $("#hud");
  hud.hidden = S.view === "start";
  if (hud.hidden) return;
  const cr = currentRound();
  $("#tl").replaceChildren(
    el("div", { class: "tl-track" }, el("div", { class: "tl-fill", style: "width:" + Math.max(0, Math.min(100, (cr / (ROUNDS.length - 1)) * 100)) + "%" })),
    ...ROUNDS.map((r, ri) => el("button", {
      class: "era" + (ri < cr ? " done" : ri === cr ? " now" : ""), type: "button", title: r.era + ": " + r.title,
      "aria-label": "Round " + (ri + 1) + ", " + r.title, onclick: () => go("round:" + ri)
    }, el("span", { class: "dot" }), el("span", { class: "lab", text: r.tag }))));
  $("#statOk").replaceChildren(el("span", { svg: ICON.check }), String(checkedCorrect()));
  const st = $("#statStreak");
  st.replaceChildren(el("span", { svg: ICON.bolt }), String(S.streak));
  st.classList.toggle("hot", S.streak >= 3);
  st.title = "Streak: " + S.streak + " in a row (best " + S.best + ")";
}

/* ===== The notebook renderer for Homework 7 =====
   One page, every question written down the sheet, marked in red pen in the margin the moment it is
   answered. State, scoring and storage all come from app_a.js, which the other homeworks share, so an
   answer is scored here exactly as it would be there. Sending reuses the same payload shape, so the rows
   land in the same sheet under the same headings. */

const PAPER = document.getElementById("paper");
const TAB = document.getElementById("tab");

if (!S.startedAt) { S.startedAt = new Date().toISOString(); save(); }
if (!S.submissionId) { S.submissionId = "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); save(); }

/* ---------- small helpers ---------- */
function nodeFor(i) { return document.getElementById("q" + i); }
function markOf(i) { return nodeFor(i).querySelector(".red"); }
function penOf(i) { return nodeFor(i).querySelector(".pennote"); }

function allFilled(i) {
  const s = SCREENS[i], A = S.answers;
  if (s.type === "mcq" || s.type === "tf") return A[s.ids[0]] !== undefined;
  if (s.type === "match") return s.ids.every((id) => A[id] !== undefined);
  if (s.type === "fill") return s.ids.every((id) => String(A[id] || "").trim() !== "");
  if (s.type === "order") return !!S.visited[i];
  return false;
}

function progress() {
  const auto = SCREENS.filter((s) => s.type !== "essay");
  const done = SCREENS.reduce((a, s, i) => a + (s.type !== "essay" && S.checked[i] ? s.ids.length : 0), 0);
  const written = SCREENS.filter((s, i) => s.type === "essay" && hasAnswer(i)).length;
  TAB.innerHTML = "<bdi>" + done + " / " + AUTO_TOTAL + "</bdi><small>marked</small>";
  const t = document.getElementById("tally");
  if (t) {
    t.innerHTML = "";
    const row = (label, v, ok) => {
      const d = document.createElement("div");
      d.innerHTML = '<span>' + label + '</span><span class="v ' + (ok ? "done" : "open") + '"><bdi>' + v + "</bdi></span>";
      t.appendChild(d);
    };
    row("Questions marked", done + " / " + AUTO_TOTAL, done === AUTO_TOTAL);
    row("Right so far", checkedCorrect() + " / " + AUTO_TOTAL, false);
    row("Written answers", written + " / " + essayCount(), written === essayCount());
  }
  const btn = document.getElementById("sendBtn");
  if (btn && !S.sent) btn.disabled = !S.name.trim();
}
function essayCount() { return SCREENS.filter((s) => s.type === "essay").length; }

/* ---------- marking ---------- */
function mark(i) {
  if (S.checked[i]) return;
  S.checked[i] = true;
  const res = itemResults(i), k = KEY.screens[i], s = SCREENS[i];
  const got = res.filter((r) => r.ok).length;
  S.streak = got === res.length ? S.streak + 1 : 0;
  S.best = Math.max(S.best || 0, S.streak);
  save();

  const node = nodeFor(i), red = markOf(i), pen = penOf(i);
  if (s.type === "mcq" || s.type === "tf") {
    const picks = node.querySelectorAll(".pick");
    picks.forEach((b, idx) => {
      b.disabled = true;
      b.classList.remove("chosen");
      const isAnswer = s.type === "tf" ? (idx === 0) === k.answer : idx === k.answer;
      const chosen = s.type === "tf" ? S.answers[s.ids[0]] === (idx === 0) : S.answers[s.ids[0]] === idx;
      if (isAnswer) b.classList.add("good");
      else if (chosen) b.classList.add("bad");
    });
  }
  if (s.type === "match") {
    node.querySelectorAll(".blank").forEach((bl, r) => {
      bl.classList.remove("live");
      bl.classList.add(res[r].ok ? "good" : "bad");
      if (!res[r].ok) bl.textContent = s.choices[k.answers[r]];
      bl.disabled = true;
    });
    node.querySelectorAll(".bank .w").forEach((w) => w.disabled = true);
  }
  if (s.type === "fill") {
    node.querySelectorAll(".wr").forEach((inp, r) => {
      inp.readOnly = true;
      inp.classList.add(res[r].ok ? "good" : "bad");
      if (!res[r].ok) inp.value = k.show[r];
    });
  }
  if (s.type === "order") {
    const cur = orderOf(i);
    const rightPos = {};
    k.correct.forEach((item, pos) => { rightPos[item] = pos + 1; });
    node.querySelectorAll(".obox").forEach((b) => b.disabled = true);
    node.querySelectorAll(".orow").forEach((row, idx) => {
      const box = row.querySelector(".obox");
      const given = cur.indexOf(idx) + 1;
      const want = rightPos[idx];
      box.classList.add(given === want ? "good" : "bad");
      box.textContent = want;
    });
    const btn = node.querySelector(".okbtn");
    if (btn) btn.remove();
  }

  red.textContent = got === res.length ? "✓" : got === 0 ? "✗" : got + "/" + res.length;
  red.className = "red on" + (got && got < res.length ? " part" : "");
  let why = k.why || "";
  let ar = k.ar || "";
  if (s.type === "match" || s.type === "fill" || s.type === "order") {
    const wrong = res.filter((r) => !r.ok).length;
    why = wrong === 0 ? "All correct."
      : s.type === "order"
        ? (res.length - wrong) + " of " + res.length + " right. The numbers in red are the right order."
        : (res.length - wrong) + " of " + res.length + " right. What is written in red is the right answer.";
    ar = "";
  }
  const english = s.type === "mcq" || s.type === "tf";
  const head = got === res.length ? "" : fixLine(i, res);
  pen.innerHTML =
    (english
      ? '<span class="en' + (got === res.length ? " fix" : "") + '">' + head + why + "</span>"
      : '<span class="en">' + head + why + "</span>") +
    "";
  pen.classList.add("on");
  progress();
}

function fixLine(i, res) {
  const s = SCREENS[i];
  if (s.type === "mcq" || s.type === "tf") return "→ " + res[0].correct + ". ";
  return "";
}

/* ---------- builders for each kind of question ---------- */
function qShell(i, number, stem, extra) {
  const d = document.createElement("div");
  d.className = "q";
  d.id = "q" + i;
  d.innerHTML = '<span class="red"></span>' +
    '<span class="n">' + number + ".</span>" +
    '<span class="st en">' + stem + "</span>" +
    (extra ? '<span class="marks">' + extra + "</span>" : "") +
    '<div class="pennote"></div>';
  return d;
}

function buildChoice(i, d) {
  const s = SCREENS[i];
  const ul = document.createElement("ul");
  ul.className = "opts";
  const labels = s.type === "tf" ? ["True", "False"] : s.options;
  labels.forEach((o, k) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "pick";
    b.type = "button";
    b.innerHTML = '<span class="let">' + "abcd"[k] + ")</span>" + o;
    const val = s.type === "tf" ? (k === 0) : k;
    if (S.answers[s.ids[0]] === val) b.classList.add("chosen");
    b.onclick = () => {
      if (S.checked[i]) return;
      S.answers[s.ids[0]] = val;
      save();
      ul.querySelectorAll(".pick").forEach((x) => x.classList.remove("chosen"));
      b.classList.add("chosen");
      mark(i);
    };
    li.appendChild(b);
    ul.appendChild(li);
  });
  d.querySelector(".pennote").before(ul);
}

function buildMatch(i, d) {
  const s = SCREENS[i];
  const wrap = document.createElement("div");
  const bank = document.createElement("div");
  bank.className = "bank";
  const rows = document.createElement("div");
  let live = null;

  const paint = () => {
    bank.querySelectorAll(".w").forEach((w, c) => {
      const used = !s.reuse && s.ids.some((id) => S.answers[id] === c);
      w.classList.toggle("used", used);
    });
  };

  s.choices.forEach((c, ci) => {
    const w = document.createElement("button");
    w.className = "w";
    w.type = "button";
    w.textContent = c;
    w.onclick = () => {
      if (S.checked[i] || !live) return;
      const r = Number(live.dataset.row);
      if (!s.reuse) s.ids.forEach((id, rr) => { if (rr !== r && S.answers[id] === ci) { delete S.answers[id]; rows.querySelectorAll(".blank")[rr].textContent = "......"; } });
      S.answers[s.ids[r]] = ci;
      live.textContent = c;
      live.classList.remove("live");
      live = null;
      save();
      paint();
      if (allFilled(i)) mark(i);
    };
    bank.appendChild(w);
  });

  s.rows.forEach((t, r) => {
    const row = document.createElement("div");
    row.className = "mrow";
    row.innerHTML = '<span class="t en">' + t + "</span>";
    const bl = document.createElement("button");
    bl.className = "blank";
    bl.type = "button";
    bl.dataset.row = r;
    const cur = S.answers[s.ids[r]];
    bl.textContent = cur === undefined ? "......" : s.choices[cur];
    bl.onclick = () => {
      if (S.checked[i]) return;
      rows.querySelectorAll(".blank").forEach((x) => x.classList.remove("live"));
      bl.classList.add("live");
      live = bl;
    };
    row.appendChild(bl);
    rows.appendChild(row);
  });

  const hint = document.createElement("p");
  hint.className = "note-line en";
  hint.textContent = s.note;
  wrap.append(hint, bank, rows);
  d.querySelector(".pennote").before(wrap);
  paint();
}

function buildOrder(i, d) {
  const s = SCREENS[i];
  const wrap = document.createElement("div");
  const hint = document.createElement("p");
  hint.className = "note-line en";
  hint.textContent = "Write the order in the boxes: 1 for the first step, and so on. Tap a box to change its number.";
  wrap.appendChild(hint);
  const cur = orderOf(i).slice();
  const seats = s.items.map((_, k) => k);

  s.items.forEach((t, k) => {
    const row = document.createElement("div");
    row.className = "orow";
    const box = document.createElement("button");
    box.className = "obox";
    box.type = "button";
    const posOf = () => cur.indexOf(k);
    box.textContent = posOf() >= 0 && S.visited[i] ? posOf() + 1 : "";
    box.onclick = () => {
      if (S.checked[i]) return;
      const taken = seats.map((p) => cur[p]);
      const now = Number(box.textContent || 0);
      const next = now >= s.items.length ? 0 : now + 1;
      box.textContent = next || "";
      const chosen = [];
      wrap.querySelectorAll(".obox").forEach((b, idx) => {
        const v = Number(b.textContent || 0);
        if (v) chosen.push([v, idx]);
      });
      const seen = {};
      let clash = false;
      chosen.forEach(([v]) => { if (seen[v]) clash = true; seen[v] = 1; });
      const ready = chosen.length === s.items.length && !clash;
      if (ready) {
        const order = [];
        chosen.sort((a, b2) => a[0] - b2[0]).forEach(([, idx]) => order.push(idx));
        S.answers["order-" + i] = order;
        save();
      }
      const ok = wrap.querySelector(".okbtn");
      if (ok) ok.disabled = !ready;
    };
    row.appendChild(box);
    const t2 = document.createElement("span");
    t2.className = "t en";
    t2.textContent = t;
    row.appendChild(t2);
    wrap.appendChild(row);
  });
  const ok = document.createElement("button");
  ok.className = "okbtn";
  ok.type = "button";
  ok.textContent = "Done, mark it";
  ok.disabled = !S.answers["order-" + i];
  ok.onclick = () => {
    if (S.checked[i] || ok.disabled) return;
    S.visited[i] = true;
    save();
    mark(i);
    ok.remove();
  };
  wrap.appendChild(ok);
  d.querySelector(".pennote").before(wrap);
}

function buildFill(i, d) {
  const s = SCREENS[i];
  const wrap = document.createElement("div");
  const hint = document.createElement("p");
  hint.className = "note-line en";
  hint.textContent = s.note;
  wrap.appendChild(hint);
  s.rows.forEach((r, k) => {
    const row = document.createElement("div");
    row.className = "frow en";
    row.append(document.createTextNode(r.before + " "));
    const inp = document.createElement("input");
    inp.className = "wr";
    inp.value = S.answers[s.ids[k]] || "";
    inp.placeholder = "......";
    inp.autocomplete = "off";
    inp.oninput = () => { S.answers[s.ids[k]] = inp.value; save(); };
    inp.onblur = () => { if (!S.checked[i] && allFilled(i)) mark(i); };
    inp.onkeydown = (e) => { if (e.key === "Enter") inp.blur(); };
    row.appendChild(inp);
    row.append(document.createTextNode(" " + r.after));
    wrap.appendChild(row);
  });
  const bank = document.createElement("div");
  bank.className = "bank";
  s.bank.forEach((w) => {
    const b = document.createElement("span");
    b.className = "w";
    b.textContent = w;
    bank.appendChild(b);
  });
  wrap.insertBefore(bank, wrap.children[1]);
  d.querySelector(".pennote").before(wrap);
}

function buildEssay(i, d) {
  const s = SCREENS[i], id = s.ids[0];
  const wrap = document.createElement("div");
  if (s.refer && s.refer.length) {
    const ref = document.createElement("div");
    ref.className = "refer";
    ref.innerHTML = '<div class="t">in your answer, refer to</div>';
    s.refer.forEach((r, k) => {
      const b = document.createElement("button");
      b.className = "tick";
      b.type = "button";
      const key = id + "-" + k;
      b.setAttribute("aria-checked", S.ticks[key] ? "true" : "false");
      b.innerHTML = '<span class="box">' + (S.ticks[key] ? "✓" : "") + '</span><span class="lb en">' + r + "</span>";
      b.onclick = () => {
        S.ticks[key] = !S.ticks[key];
        save();
        b.setAttribute("aria-checked", S.ticks[key] ? "true" : "false");
        b.querySelector(".box").textContent = S.ticks[key] ? "✓" : "";
      };
      ref.appendChild(b);
    });
    wrap.appendChild(ref);
  }
  const ta = document.createElement("textarea");
  ta.className = "essaybox";
  ta.value = S.answers[id] || "";
  ta.placeholder = "Write your answer in English here";
  const wc = document.createElement("div");
  wc.className = "wc";
  const count = () => {
    const n = (ta.value.trim().match(/\S+/g) || []).length;
    wc.textContent = n + (n === 1 ? " word" : " words") + (S.sent ? "" : " · saved as you write");
  };
  ta.oninput = () => { S.answers[id] = ta.value; save(); count(); progress(); };
  if (S.sent) ta.readOnly = true;
  count();
  wrap.append(ta, wc);
  d.querySelector(".pennote").before(wrap);
}

/* ---------- lay the whole notebook out ---------- */
function layout() {
  let round = -1, number = 0;
  SCREENS.forEach((s, i) => {
    if (s.round !== round) {
      round = s.round;
      const h = document.createElement("p");
      h.className = "sec";
      const n = SCREENS.filter((x) => x.round === round).reduce((a, x) => a + x.ids.length, 0);
      h.innerHTML = ROUNDS[round].title + ' <span class="cnt">(' + n +
        (s.type === "essay" ? " marks" : " points") + ")</span>";
      PAPER.appendChild(h);
    }
    number++;
    const stem = s.type === "essay" ? s.q
      : s.type === "mcq" || s.type === "tf" ? s.q
      : s.note ? "" : "";
    const d = qShell(i, number,
      s.type === "match" ? "Match each one." : s.type === "order" ? "Put these in order." :
      s.type === "fill" ? "Complete the sentences." : stem,
      s.type === "essay" ? "[" + s.marks + "]" : "");
    if (s.type === "mcq" || s.type === "tf") buildChoice(i, d);
    else if (s.type === "match") buildMatch(i, d);
    else if (s.type === "order") buildOrder(i, d);
    else if (s.type === "fill") buildFill(i, d);
    else buildEssay(i, d);
    PAPER.appendChild(d);
    if (S.checked[i]) replay(i, d);
  });
  handIn();
  progress();
  if (S.sent) showResult();
}

/* a question that was already marked before the page was reopened */
function replay(i, d) {
  S.checked[i] = false;
  const s = SCREENS[i];
  if (s.type === "order") S.visited[i] = true;
  mark(i);
}

/* ---------- hand in ---------- */
function handIn() {
  const box = document.createElement("div");
  box.className = "handin";
  box.id = "handin";
  box.innerHTML = '<h2>Hand it in</h2>' +
    '<div class="tally" id="tally"></div>' +
    '<p class="note-line">Once you hand in, your answers go to El Bashmohandes and nothing can be ' +
    'changed. He marks the written answers himself.</p>' +
    '<button class="send" id="sendBtn" type="button" disabled>Hand in to El Bashmohandes</button>' +
    '<p class="status" id="status"></p>' +
    '<p style="margin-top:12px"><button class="ghost" id="bk">Save a copy to this phone</button>' +
    '<button class="ghost" id="rd">Open a copy you saved</button>' +
    '<input id="rdf" type="file" accept="application/json" hidden></p>';
  PAPER.appendChild(box);

  document.getElementById("sendBtn").onclick = send;
  document.getElementById("bk").onclick = () => saveBackup();
  document.getElementById("rd").onclick = () => document.getElementById("rdf").click();
  document.getElementById("rdf").onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) readBackup(f).then(() => location.reload()).catch(() => alert("That file is not a copy of this homework."));
  };
}

function fmtDate(d) {
  try { return new Date(d).toLocaleString("en-GB", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }); }
  catch (e) { return String(d); }
}
function countWords(a) { return (String(a).trim().match(/\S+/g) || []).length; }

function buildPayload() {
  const now = new Date();
  const results = [];
  SCREENS.forEach((s, i) => { if (s.type !== "essay") itemResults(i).forEach((r) => results.push(r)); });
  const t = totals();
  const pct = Math.round((t.got / t.of) * 100);
  const mistakes = results.filter((r) => !r.ok).map((r) => ({ id:r.id, lesson:KEY.lessons[r.id], given:r.given, correct:r.correct }));
  const essays = SCREENS.map((s, i) => [s, i]).filter(([s]) => s.type === "essay").map(([s, i]) => {
    const id = s.ids[0], a = String(S.answers[id] || "").trim();
    return { id, lesson:KEY.lessons[id], marks:s.marks, question:s.q, answer:a, words:countWords(a) };
  });
  const minutes = S.startedAt ? Math.round((now - new Date(S.startedAt)) / 60000) : "";
  const columns = [
    ["Submitted at", fmtDate(now)], ["Student", S.name], ["Score", t.got], ["Out of", t.of], ["Percent", pct + "%"],
    ["Essay mark /" + ESSAY_MARKS + " (you fill)", ""], ["Mistakes", mistakes.length],
    ["Minutes since starting", minutes], ["Best streak", S.best]
  ];
  t.rounds.forEach((r) => columns.push([r.title, r.got + "/" + r.of]));
  results.forEach((r) => columns.push([r.id + " [" + KEY.lessons[r.id] + "]", (r.ok ? "✓ " : "✗ ") + r.given + (r.ok ? "" : "  →  " + r.correct)]));
  essays.forEach((e) => columns.push([e.id + " [" + e.lesson + "] /" + e.marks, e.answer || "(no answer)"]));
  columns.push(["Submission ID", S.submissionId]);
  return { homework:HW.title, sheet:HW.sheet, submissionId:S.submissionId, name:S.name, submittedAt:now.toISOString(),
           minutes, score:t.got, outOf:t.of, percent:pct, essayMarks:ESSAY_MARKS, bestStreak:S.best,
           rounds:t.rounds, mistakes, essays, columns };
}

async function send() {
  const btn = document.getElementById("sendBtn"), status = document.getElementById("status");
  if (!S.name.trim()) { status.className = "status bad"; status.textContent = "Write your name at the top first."; return; }
  const open = SCREENS.filter((s, i) => s.type !== "essay" && !S.checked[i]).length;
  const blank = SCREENS.filter((s, i) => s.type === "essay" && !hasAnswer(i)).length;
  if ((open || blank) && !btn.classList.contains("again")) {
    btn.classList.add("again");
    btn.textContent = "Hand in anyway";
    status.className = "status bad";
    status.textContent = "You still have " + (open ? open + " question" + (open === 1 ? "" : "s") + " unanswered" : "") +
      (open && blank ? " and " : "") + (blank ? blank + " empty written answer" + (blank === 1 ? "" : "s") : "") +
      ". Tap again to hand in as it is.";
    return;
  }
  if (!HW.endpoint) {
    status.className = "status bad";
    status.textContent = "Sending is not switched on yet. Tell El Bashmohandes and keep this page: your answers are saved.";
    return;
  }
  SCREENS.forEach((s, i) => { if (s.type !== "essay") S.checked[i] = true; });
  save();
  const payload = JSON.stringify(buildPayload());
  btn.disabled = true;
  status.className = "status";
  status.textContent = "Sending to El Bashmohandes...";
  let reached = false, refused = false;
  try {
    const res = await fetch(HW.endpoint, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
                                           body:payload, redirect:"follow" });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (data && data.ok) reached = true;
    else if (data && data.ok === false) refused = true;
    else reached = res.ok;
  } catch (e) {
    try {
      await fetch(HW.endpoint, { method:"POST", mode:"no-cors",
                                 headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:payload });
      reached = true;
    } catch (e2) { reached = false; }
  }
  if (refused || !reached) {
    btn.disabled = false;
    status.className = "status bad";
    status.textContent = refused
      ? "It reached the sheet but was not saved. Tap hand in again, and if it happens twice tell El Bashmohandes."
      : "The connection dropped. Your answers are saved: try again when you are back online.";
    return;
  }
  S.sent = new Date().toISOString();
  save();
  status.className = "status good";
  status.textContent = "Handed in. " + fmtDate(S.sent);
  btn.textContent = "Handed in";
  showResult();
}

function showResult() {
  if (document.getElementById("result")) return;
  const t = totals(), pct = Math.round((t.got / t.of) * 100);
  const box = document.createElement("div");
  box.className = "result";
  box.id = "result";
  let html = '<div class="big">' + t.got + " <span>/ " + t.of + " · " + pct + "%</span></div>" +
    '<div class="line">That is the mark for the questions with one right answer. The written answers (' +
    ESSAY_MARKS + ' marks) are marked by El Bashmohandes himself.</div>';
  t.rounds.forEach((r) => { html += '<div class="line">' + r.title + ": <b>" + r.got + " / " + r.of + "</b></div>"; });
  box.innerHTML = html;
  SCREENS.forEach((s, i) => {
    if (s.type !== "essay") return;
    const k = KEY.screens[i];
    if (!k || !k.model) return;
    const m = document.createElement("div");
    m.className = "model";
    m.innerHTML = '<div class="t">model answer &middot; ' + s.marks + ' marks</div><p class="en">' + k.model + "</p>";
    box.appendChild(m);
  });
  document.getElementById("handin").appendChild(box);
  document.querySelectorAll(".essaybox").forEach((t2) => t2.readOnly = true);
  box.scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ---------- name, warning, boot ---------- */
const nameInput = document.getElementById("nameInput");
nameInput.value = S.name || "";
nameInput.oninput = () => { S.name = nameInput.value; save(); progress(); };
if (S.sent) nameInput.readOnly = true;
document.getElementById("today").textContent = new Date().toLocaleDateString("en-GB",
  { day:"numeric", month:"long", year:"numeric" });

if (!STORE_OK) {
  const w = document.createElement("div");
  w.className = "warn";
  w.innerHTML = "<b>This browser is keeping nothing.</b> If you close the page your answers are gone. " +
    "Open the link in a normal tab, not a Private one, or finish the homework in one sitting.";
  PAPER.appendChild(w);
}

layout();

</script>
