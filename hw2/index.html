<style>
[hidden]{display:none!important}
:root{
  --night:#060B20; --navy:#0B1437; --panel:#111B45; --panel-2:#16235A; --panel-3:#1C2B6B;
  --line:rgba(127,147,184,.22); --line-2:rgba(127,147,184,.38);
  --ice:#E6F0FA; --ice-2:#B7C6DD; --muted:#7F93B8;
  --cyan:#27E1C1; --cyan-2:#8FF3E2; --cyan-t:rgba(39,225,193,.12);
  --amber:#FFB020; --amber-t:rgba(255,176,32,.13);
  --coral:#FF6B6B; --coral-t:rgba(255,107,107,.13);
  --display:"Unbounded","Arial Black",Impact,system-ui,sans-serif;
  --sans:"Atkinson Hyperlegible",Arial,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --arabic:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ice);font-family:var(--sans);font-size:17px;line-height:1.5;
  background:
    radial-gradient(900px 520px at 8% -8%,rgba(39,225,193,.13),transparent 62%),
    radial-gradient(800px 560px at 108% 104%,rgba(255,176,32,.09),transparent 60%),
    var(--night);
  background-attachment:fixed;padding-inline:16px;padding-block:0 120px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(183,198,221,.10) 1px,transparent 1.4px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 70%);mask-image:linear-gradient(180deg,#000 0%,transparent 70%)}
.app{position:relative;z-index:1;max-width:680px;margin-inline:auto}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cyan-2);outline-offset:3px;border-radius:8px}
.ar{font-family:var(--arabic);direction:rtl;text-align:right;letter-spacing:0;line-height:1.8}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.125em}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:20;margin-inline:-16px;padding:10px 16px 12px;
  background:rgba(6,11,32,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hud-in{max-width:680px;margin-inline:auto;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"map tl stats";gap:14px;align-items:center}
.map-btn{grid-area:map;width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;font-size:20px;color:var(--ice)}
.map-btn:hover{border-color:var(--cyan)}
.stats{grid-area:stats;display:flex;gap:6px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px;font-weight:700;padding:6px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.ok{color:var(--cyan)}
.stat.streak{color:var(--amber)}
.stat.streak.hot{background:var(--amber-t);border-color:rgba(255,176,32,.5)}
.tl{grid-area:tl;position:relative;display:grid;grid-template-columns:repeat(6,1fr);padding-top:2px}
.tl-track{position:absolute;left:calc(100%/12);right:calc(100%/12);top:8px;height:2px;background:var(--line-2);border-radius:2px}
.tl-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cyan),var(--cyan-2));border-radius:2px;box-shadow:0 0 12px rgba(39,225,193,.6);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.era{position:relative;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;color:var(--muted)}
.era .dot{width:14px;height:14px;border-radius:50%;background:var(--night);border:2px solid var(--line-2);transition:all .3s}
.era .lab{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.era.done .dot{background:var(--cyan);border-color:var(--cyan)}
.era.now .dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 5px rgba(255,176,32,.18);animation:pulse 2s infinite}
.era.now .lab{color:var(--ice)}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,176,32,0)}}
@media (max-width:520px){
  .hud-in{grid-template-columns:auto 1fr;grid-template-areas:"map stats" "tl tl";row-gap:10px}
  .stats{justify-self:end}
}

/* ---------- views ---------- */
.view{padding-top:22px;animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grad{background:linear-gradient(95deg,var(--cyan) 0%,var(--cyan-2) 45%,var(--ice) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- start ---------- */
.hero{position:relative;margin-top:18px;border-radius:26px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(22,35,90,.85),rgba(11,20,55,.92))}
.net{display:block;width:100%;height:230px}
.hero-body{position:relative;padding:4px 24px 26px;display:grid;gap:14px;margin-top:-54px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,10vw,62px);line-height:1;letter-spacing:-.025em}
.hero .lead{color:var(--ice-2);font-size:18px;max-width:34rem}
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.rcard{padding:12px;border-radius:14px;background:rgba(6,11,32,.45);border:1px solid var(--line);display:grid;gap:2px}
.rcard .yr{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--amber)}
.rcard .nm{font-family:var(--display);font-size:13px;font-weight:600;line-height:1.2}
.rcard .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
@media (max-width:420px){.rounds{grid-template-columns:repeat(2,1fr)}}
.join{margin-top:18px;padding:22px;border-radius:22px;background:var(--panel);border:1px solid var(--line);display:grid;gap:12px}
.join label{font-family:var(--display);font-size:15px;font-weight:600}
.name{width:100%;padding:16px 18px;border-radius:14px;border:2px solid var(--line-2);background:var(--night);font-size:20px;font-weight:700;color:var(--ice)}
.name::placeholder{color:#4F618A;font-weight:400}
.name:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(39,225,193,.15)}
.err{color:var(--coral);font-weight:700;font-size:15px}
.note{color:var(--muted);font-size:14.5px}
.note.ar{font-size:15px}

/* ---------- round intro ---------- */
.round{min-height:62vh;display:grid;align-content:center;justify-items:center;text-align:center;gap:14px;position:relative;padding-block:30px}
.rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:-1}
.rings span{position:absolute;width:220px;height:220px;border-radius:50%;border:1px solid rgba(39,225,193,.25);animation:ring 3.6s cubic-bezier(.2,.6,.3,1) infinite}
.rings span:nth-child(2){animation-delay:1.2s}
.rings span:nth-child(3){animation-delay:2.4s}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
.round .decade{font-family:var(--display);font-weight:800;font-size:clamp(52px,17vw,104px);line-height:.95;letter-spacing:-.03em}
.round .era-name{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.round h2{font-family:var(--display);font-size:clamp(24px,6vw,32px);font-weight:700;margin-top:6px}
.round .how{color:var(--ice-2);max-width:28rem}
.round .count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:16px 22px;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.01em;text-decoration:none;transition:transform .12s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{color:#04112B;background:linear-gradient(135deg,var(--cyan-2),var(--cyan) 55%,#1BC3A7);box-shadow:0 8px 28px rgba(39,225,193,.32),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.primary:hover{box-shadow:0 10px 34px rgba(39,225,193,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.amber{color:#1D1302;background:linear-gradient(135deg,#FFD27A,var(--amber));box-shadow:0 8px 28px rgba(255,176,32,.3)}
.btn.ghost{color:var(--ice);background:var(--panel);border:1px solid var(--line-2)}
.btn[disabled]{opacity:.38;box-shadow:none;cursor:not-allowed}
.btn.wide{width:100%}

/* ---------- question screen ---------- */
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-type{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--cyan-t);color:var(--cyan)}
.chip-type.essay{background:var(--amber-t);color:var(--amber)}
.qnum{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ice-2)}
.qpos{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stem{margin-top:16px;font-size:clamp(20px,5.2vw,24px);line-height:1.38;font-weight:700;letter-spacing:-.005em}
.instr{margin-top:8px;color:var(--ice-2);font-size:16px}
.body{margin-top:20px;display:grid;gap:10px}

.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);color:var(--ice);font-size:17px;line-height:1.4;transition:border-color .15s,background .15s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--line-2);background:var(--panel-2)}
.opt:active:not([disabled]){transform:scale(.985)}
.opt .key{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:700;background:var(--night);border:1px solid var(--line-2);transition:all .15s}
.opt[aria-checked="true"]{border-color:var(--cyan);background:var(--cyan-t)}
.opt[aria-checked="true"] .key{background:var(--cyan);color:#04112B;border-color:var(--cyan)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--cyan);background:rgba(39,225,193,.16)}
.opt.right .key{background:var(--cyan);color:#04112B;border-color:var(--cyan)}
.opt.wrong{border-color:var(--coral);background:var(--coral-t);animation:shake .42s}
.opt.wrong .key{background:var(--coral);color:#2A0606;border-color:var(--coral)}
.opt.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.opt.right.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1.4)}
@keyframes pop{40%{transform:scale(1.03)}}

.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{flex-direction:column;justify-content:center;gap:6px;padding:22px 10px;min-height:150px}
.tf .glyph{font-family:var(--display);font-size:58px;line-height:1;font-weight:500}
.tf .word{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ice-2)}

/* match */
.mrow{border-radius:16px;border:1.5px solid var(--line);background:var(--panel);padding:14px 16px;display:grid;gap:10px}
.mrow .mt{display:flex;gap:12px;align-items:flex-start}
.mrow .n{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);padding-top:3px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--night);color:var(--ice-2);font-size:15px;font-weight:700;transition:all .15s}
.pick:hover:not([disabled]){border-color:var(--cyan);color:var(--ice)}
.pick[aria-checked="true"]{background:var(--cyan);border-color:var(--cyan);color:#04112B}
.pick[disabled]{cursor:default}
.pick.right{background:var(--cyan);border-color:var(--cyan);color:#04112B}
.pick.wrong{background:var(--coral);border-color:var(--coral);color:#2A0606}
.pick.dim{opacity:.35}
.mrow.good{border-color:rgba(39,225,193,.6)}
.mrow.bad{border-color:rgba(255,107,107,.6)}

/* order */
.ends{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:8px}
.orow{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s}
.orow .pos{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--night);border:1px solid var(--line-2)}
.orow .ot{flex:1;font-weight:700}
.orow .mv{display:flex;gap:6px}
.orow .mv button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--night);display:grid;place-items:center;font-size:18px;color:var(--ice)}
.orow .mv button:hover:not([disabled]){border-color:var(--cyan)}
.orow .mv button[disabled]{opacity:.25;cursor:default}
.orow.moved{border-color:var(--cyan)}
.orow.good{border-color:rgba(39,225,193,.7);background:rgba(39,225,193,.1)}
.orow.bad{border-color:rgba(255,107,107,.7);background:var(--coral-t)}
.orow .fix{font-size:14px;color:var(--ice-2);font-weight:400}

/* fill */
.bank{position:sticky;top:112px;z-index:5;padding:12px;border-radius:16px;background:rgba(17,27,69,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px dashed var(--line-2);display:grid;gap:8px}
@media (min-width:521px){.bank{top:78px}}
.bank .picks{gap:6px}
.bank .pick.used{opacity:.4}
.frow{padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:flex-start}
.frow .n{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);padding-top:9px}
.frow .s{line-height:2.4;font-size:17px}
.blank{display:inline-block;width:8.5em;max-width:100%;padding:4px 10px;border:0;border-bottom:2.5px solid var(--cyan);border-radius:10px 10px 4px 4px;background:var(--night);color:var(--cyan-2);font-weight:700;text-align:center;font-size:17px}
.blank:focus{outline:none;box-shadow:0 0 0 3px rgba(39,225,193,.25)}
.blank.right{border-bottom-color:var(--cyan);background:rgba(39,225,193,.16);color:var(--ice)}
.blank.wrong{border-bottom-color:var(--coral);background:var(--coral-t);color:var(--ice);text-decoration:line-through;text-decoration-color:var(--coral)}
.fix-inline{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--cyan);line-height:1.4}

/* essay */
.marks{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber);padding:5px 10px;border-radius:999px;border:1px solid rgba(255,176,32,.45)}
.refer{padding:14px 16px;border-radius:16px;background:var(--amber-t);border:1px solid rgba(255,176,32,.28);display:grid;gap:10px}
.refer .t{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.tick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;border:0;background:rgba(6,11,32,.35);color:var(--ice);font-size:16px}
.tick .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);display:grid;place-items:center;font-size:13px;color:#1D1302}
.tick[aria-checked="true"] .box{background:var(--amber)}
.tick[aria-checked="true"] .lb{color:var(--ice-2);text-decoration:line-through;text-decoration-color:rgba(255,176,32,.7)}
.essay{width:100%;min-height:22rem;padding:18px;border-radius:18px;border:1.5px solid var(--line-2);background:var(--night);color:var(--ice);font-size:18px;line-height:1.65;resize:vertical}
.essay:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,176,32,.14)}
.essay[readonly]{opacity:.85}
.wc{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wc .bar{flex:1;height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.wc .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#FFD27A);border-radius:6px;transition:width .3s}
.wc .saved{color:var(--cyan)}
.model{padding:16px;border-radius:16px;border:1px solid rgba(39,225,193,.35);background:var(--cyan-t);display:grid;gap:8px}
.model .t{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.model .h{font-size:14.5px;color:var(--ice-2)}

/* feedback */
.fb{margin-top:18px;padding:16px 18px;border-radius:18px;display:grid;gap:8px;animation:enter .35s cubic-bezier(.2,.8,.2,1) both}
.fb.good{background:linear-gradient(135deg,rgba(39,225,193,.18),rgba(39,225,193,.06));border:1px solid rgba(39,225,193,.45)}
.fb.bad{background:linear-gradient(135deg,rgba(255,107,107,.16),rgba(255,107,107,.05));border:1px solid rgba(255,107,107,.45)}
.fb.part{background:linear-gradient(135deg,rgba(255,176,32,.16),rgba(255,176,32,.05));border:1px solid rgba(255,176,32,.45)}
.fb .hd{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;font-weight:700}
.fb.good .hd{color:var(--cyan)}
.fb.bad .hd{color:var(--coral)}
.fb.part .hd{color:var(--amber)}
.fb .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#04112B}
.fb.good .ic{background:var(--cyan)}
.fb.bad .ic{background:var(--coral)}
.fb.part .ic{background:var(--amber)}
.fb .ans{font-weight:700}
.fb .ar{color:var(--ice-2);font-size:15.5px}

/* sticky action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,11,32,0),rgba(6,11,32,.92) 30%)}
.actions-in{max-width:680px;margin-inline:auto;display:flex;gap:10px}
.actions-in .btn.primary,.actions-in .btn.amber{flex:1}

/* map drawer */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(3,6,18,.66);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:86vh;overflow:auto;padding:18px 16px 28px;border-radius:24px 24px 0 0;background:var(--navy);border-top:1px solid var(--line-2);animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.drawer-in{max-width:680px;margin-inline:auto;display:grid;gap:18px}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drawer-hd h2{font-family:var(--display);font-size:20px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ice-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.mapgrp{display:grid;gap:8px}
.mapgrp .t{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.cell{height:40px;border-radius:10px;border:1.5px solid var(--line-2);background:transparent;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ice-2)}
.cell.seen{background:var(--panel-2);color:var(--ice)}
.cell.good{background:var(--cyan);border-color:var(--cyan);color:#04112B}
.cell.bad{background:var(--coral);border-color:var(--coral);color:#2A0606}
.cell.part{background:var(--amber);border-color:var(--amber);color:#1D1302}
.cell.essay{border-color:var(--amber);color:var(--amber)}
.cell.here{box-shadow:0 0 0 3px var(--ice)}

/* finish + result */
.panel{margin-top:18px;padding:22px;border-radius:22px;background:var(--panel);border:1px solid var(--line);display:grid;gap:14px}
.big-title{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.05;letter-spacing:-.02em}
.checklist{display:grid;gap:8px}
.ck{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--night);border:1px solid var(--line)}
.ck .d{flex:none;width:12px;height:12px;border-radius:50%}
.ck .x{flex:1}
.ck .v{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.status{display:flex;align-items:center;gap:10px;font-weight:700;min-height:1.5em}
.status.bad{color:var(--coral)}
.status.good{color:var(--cyan)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--cyan);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{text-align:center;justify-items:center;padding-block:34px 26px;background:radial-gradient(420px 260px at 50% 0%,rgba(39,225,193,.16),transparent 70%),var(--panel)}
.ring{position:relative;width:210px;height:210px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ring .sc{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.ring .of{font-family:var(--mono);font-size:13px;color:var(--muted)}
.level{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.bars{display:grid;gap:10px;width:100%;text-align:left}
.brow{display:grid;grid-template-columns:minmax(6.5rem,9rem) 1fr auto;gap:12px;align-items:center;font-size:14.5px}
.brow .tr{height:10px;border-radius:10px;background:var(--night);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--cyan),var(--cyan-2));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brow .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.foot{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.view.still{animation:none}
.opt.still{animation:none}
</style>
</head>

const CLOUD_GAP = 30000;

                          answered: answeredCount(), state: JSON.stringify(S) });
}

  if (leaving && navigator.sendBeacon) { try { navigator.sendBeacon(HW.endpoint, new Blob([body], { type })); return; } catch (e) {} }

/* Reading back uses a <script> tag, not fetch: it is the one request a browser never blocks for being
   cross-site, so it works the same in every phone browser. */

  return new Promise((resolve) => {
    if (!HW.endpoint) return resolve(null);
    const cb = "hwcb" + Math.random().toString(36).slice(2, 9);
    const tag = document.createElement("script");
    let t = 0;
    const done = (v) => { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } tag.remove(); resolve(v); };
    t = setTimeout(() => done(null), 6000);

/* ---------- scoring ---------- */
function norm(s) {
  return String(s || "").toLowerCase().replace(/[‘’`´]/g, "'").replace(/[^a-z0-9.,'\/ ]/g, " ")
    .replace(/\s+/g, " ").trim().replace(/[.,]+$/, "").trim();
}
function orderOf(i) {
  const s = SCREENS[i];
  const cur = S.answers["order-" + i];

}
/* one entry per point: {id, ok, given, correct} */
function itemResults(i) {
  const s = SCREENS[i], k = KEY.screens[i], A = S.answers;
  if (s.type === "mcq") {
    const v = A[s.ids[0]];
    return [{ id: s.ids[0], ok: v === k.answer, given: typeof v === "number" ? "ABCD"[v] + ". " + s.options[v] : "no answer", correct: "ABCD"[k.answer] + ". " + s.options[k.answer] }];
  }
  if (s.type === "tf") {
    const v = A[s.ids[0]];
    const t = (b) => (b ? "True" : "False");
    return [{ id: s.ids[0], ok: v === k.answer, given: typeof v === "boolean" ? t(v) : "no answer", correct: t(k.answer) }];
  }
  if (s.type === "match") return s.ids.map((id, r) => {
    const v = A[id];
    return { id, ok: v === k.answers[r], given: typeof v === "number" ? s.choices[v] : "no answer", correct: s.choices[k.answers[r]] };
  });
  if (s.type === "order") {
    const cur = orderOf(i);
    return s.ids.map((id, p) => ({ id, ok: cur[p] === k.correct[p], given: s.items[cur[p]], correct: s.items[k.correct[p]] }));
  }
  if (s.type === "fill") return s.ids.map((id, r) => {
    const v = String(A[id] || "").trim();
    return { id, ok: k.accept[r].map(norm).includes(norm(v)), given: v || "no answer", correct: k.show[r] };
  });

}
function screenScore(i) { const r = itemResults(i); return { got: r.filter((x) => x.ok).length, of: r.length }; }
function hasAnswer(i) {
  const s = SCREENS[i], A = S.answers;

  if (s.type === "order") return !!S.visited[i];
  if (s.type === "essay") return String(A[s.ids[0]] || "").trim().length > 0;
  return s.ids.some((id) => A[id] !== undefined && String(A[id]).trim() !== "");
}
function screenState(i) {
  const s = SCREENS[i];
  if (s.type === "essay") return hasAnswer(i) ? "essay" : "";
  if (S.checked[i]) { const sc = screenScore(i); return sc.got === sc.of ? "good" : sc.got === 0 ? "bad" : "part"; }
  return hasAnswer(i) ? "seen" : "";
}
function totals() {
  let got = 0;
  const rounds = ROUNDS.map((r, ri) => ({ title: r.title, got: 0, of: 0 }));
  SCREENS.forEach((s, i) => {
    if (s.type === "essay") return;
    const sc = screenScore(i);
    rounds[s.round].of += sc.of;
    if (S.checked[i]) { rounds[s.round].got += sc.got; got += sc.got; }
  });

}
function checkedCorrect() {
  let n = 0;
  SCREENS.forEach((s, i) => { if (S.checked[i] && s.type !== "essay") n += screenScore(i).got; });
  return n;
}

/* animated neural network: the knowledge is in the lines */
function startNet(c) {

      for (let k = 0; k < n; k++) nodes.push({ x, y: H * 0.14 + (H * 0.6) * ((k + 0.5) / n), li, glow: 0 });
    });
    nodes.forEach((a) => nodes.forEach((b) => { if (b.li === a.li + 1) edges.push({ a, b, w: Math.pow(Math.random(), 2.2) }); }));
  }
  build();

    if (!c.isConnected) return;
    if (c.clientWidth !== W) build();
    const dt = Math.min(50, t - (last || t)); last = t;
    ctx.clearRect(0, 0, W, H);
    edges.forEach((e) => {
      ctx.strokeStyle = "rgba(143,243,226," + (0.05 + e.w * 0.35) + ")";
      ctx.lineWidth = 0.6 + e.w * 3.2;
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
    });
    if (!reduce && Math.random() < 0.22) {
      const starts = edges.filter((e) => e.a.li === 0 || Math.random() < 0.08);
      const e = starts[Math.floor(Math.random() * starts.length)];
      if (e && e.w > 0.25) pulses.push({ e, p: 0 });
    }
    pulses = pulses.filter((p) => {
      p.p += dt / (700 - p.e.w * 300);
      if (p.p >= 1) {
        p.e.b.glow = 1;
        const nxt = edges.filter((x) => x.a === p.e.b && x.w > 0.3);
        if (nxt.length && Math.random() < 0.8) pulses.push({ e: nxt[Math.floor(Math.random() * nxt.length)], p: 0 });
        return false;
      }
      const x = p.e.a.x + (p.e.b.x - p.e.a.x) * p.p, y = p.e.a.y + (p.e.b.y - p.e.a.y) * p.p;

      return true;
    });

      n.glow = Math.max(0, n.glow - dt / 600);
      ctx.fillStyle = "#060B20"; ctx.strokeStyle = n.glow > 0 ? "rgba(255,176,32," + (0.5 + n.glow / 2) + ")" : "rgba(39,225,193,.85)";
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(n.x, n.y, 6 + n.glow * 2.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });

  }

}

function buildPayload() {
  const now = new Date();

  const mistakes = results.filter((r) => !r.ok).map((r) => ({ id: r.id, lesson: KEY.lessons[r.id], given: r.given, correct: r.correct }));
  const essays = essayIdx().map((i) => {

    return { id, lesson: KEY.lessons[id], marks: s.marks, question: s.q, answer: a, words: countWords(a) };
  });
  const minutes = S.startedAt ? Math.round((now - new Date(S.startedAt)) / 60000) : "";
  const columns = [

async function doSend(btn, status) {
  if (!HW.endpoint) {
    status.className = "status bad";
    status.textContent = "Sending is not switched on yet. Tell El Bashmohandes, and keep this page: your answers are saved.";
    return;
  }
  SCREENS.forEach((s, i) => { if (s.type !== "essay") S.checked[i] = true; });
  save();
  const payload = JSON.stringify(buildPayload());
  btn.disabled = true;
  status.className = "status";
  status.replaceChildren(el("span", { class: "spin" }), "Sending to El Bashmohandes...");
  let confirmed = false, reached = false, refused = false;
  try {
    const res = await fetch(HW.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: payload, redirect: "follow" });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (data && data.ok) { confirmed = true; reached = true; }
    else if (data && data.ok === false) refused = true;
    else reached = res.ok;
  } catch (e) {
    /* the answer could not be read (network or browser rule): send once more without reading it.

    try { await fetch(HW.endpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: payload }); reached = true; }
    catch (e2) { reached = false; }

    status.textContent = "Your homework reached El Bashmohandes's sheet but could not be saved. Tap Send again, and if it happens twice, tell El Bashmohandes.";
    return;
  }
  if (!reached) {
    btn.disabled = false;
    status.className = "status bad";
    status.textContent = "Could not send. Check your internet connection and tap Send again. Your answers are safe on this phone.";
    return;
  }
  S.sent = { at: new Date().toISOString(), confirmed };
  save();
  go("result");
  burst();
}

  const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .38, vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 4,

}
function go(view) { saveNow(); S.view = view; save(); render(true); }

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || document.querySelector(".drawer")) return;
  if (!S.view.startsWith("q:")) return;
  const i = Number(S.view.slice(2)), s = SCREENS[i];
  if ((s.type === "mcq" && /^[a-d]$/i.test(e.key)) || (s.type === "tf" && /^[tf]$/i.test(e.key))) {
    const idx = s.type === "mcq" ? "abcd".indexOf(e.key.toLowerCase()) : e.key.toLowerCase() === "t" ? 0 : 1;
    const b = document.querySelectorAll("#view .opt")[idx]; if (b && !b.disabled) b.click();
  } else if (e.key === "Enter") {
    const main = document.querySelector("#actionsIn .btn:last-child"); if (main && !main.disabled) { e.preventDefault(); main.click(); }
  }
});
$("#mapBtn").addEventListener("click", openMap);
render(false);

/* The page can be closed at any moment, so push the last changes out before the phone takes it away. */
addEventListener("pagehide", () => { saveNow(); if (cloudDirty) cloudPush(true); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { saveNow(); if (cloudDirty) cloudPush(true); }
});
/* Ask the browser to keep this site's storage instead of clearing it when it tidies up. */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

</script>
